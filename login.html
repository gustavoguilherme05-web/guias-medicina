<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar ou criar conta — Guia Med</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">Guia<span>Med</span></a>
    <button class="menu-toggle icon-btn" id="menuToggle" aria-label="Abrir menu">☰</button>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Início</a></li>
      <li><a href="index.html#feed">Guias</a></li>
      <li><a href="sobre.html">Sobre</a></li>
      <li><a href="contato.html">Contato</a></li>
    </ul>
    <div class="search-box" style="visibility:hidden;"><input></div>
    <button class="icon-btn" id="darkToggle" title="Alternar modo escuro" aria-label="Alternar modo escuro">🌙</button>
    <div class="auth-area" id="authArea"></div>
  </div>
</header>

<div class="auth-wrapper">
  <div class="auth-card">
    <h1>Bem-vindo(a)</h1>
    <p class="auth-subtitle">Entre ou crie sua conta gratuita para salvar guias e acompanhar seu progresso.</p>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin" type="button">Entrar</button>
      <button class="auth-tab" id="tabCadastro" type="button">Criar conta</button>
    </div>

    <!-- FORMULÁRIO DE LOGIN -->
    <form class="auth-form active" id="formLogin" novalidate>
      <div class="form-group">
        <label for="loginEmail">E-mail</label>
        <input type="email" id="loginEmail" autocomplete="email" required>
        <span class="form-error" id="erroLoginEmail"></span>
      </div>
      <div class="form-group">
        <label for="loginSenha">Senha</label>
        <input type="password" id="loginSenha" autocomplete="current-password" required>
        <span class="form-error" id="erroLoginSenha"></span>
      </div>
      <button type="submit" class="btn btn-primary">Entrar</button>
    </form>

    <!-- FORMULÁRIO DE CADASTRO -->
    <form class="auth-form" id="formCadastro" novalidate>
      <div class="form-group">
        <label for="cadNome">Nome completo</label>
        <input type="text" id="cadNome" autocomplete="name" required>
        <span class="form-error" id="erroCadNome"></span>
      </div>
      <div class="form-group">
        <label for="cadEmail">E-mail</label>
        <input type="email" id="cadEmail" autocomplete="email" required>
        <span class="form-error" id="erroCadEmail"></span>
      </div>
      <div class="form-group">
        <label for="cadSenha">Senha</label>
        <input type="password" id="cadSenha" autocomplete="new-password" required>
        <span class="form-hint">Mínimo de 8 caracteres.</span>
        <span class="form-error" id="erroCadSenha"></span>
      </div>
      <div class="form-group">
        <label for="cadSenha2">Confirmar senha</label>
        <input type="password" id="cadSenha2" autocomplete="new-password" required>
        <span class="form-error" id="erroCadSenha2"></span>
      </div>
      <button type="submit" class="btn btn-primary">Criar conta</button>
    </form>

    <div class="auth-switch">
      <span id="textoSwitch">Ainda não tem conta?</span>
      <button type="button" id="btnSwitch">Criar agora</button>
    </div>
  </div>
</div>

<footer class="site-footer">
  <nav>
    <a href="sobre.html">Sobre</a>
    <a href="privacidade.html">Política de Privacidade</a>
    <a href="contato.html">Contato</a>
  </nav>
  <span class="copyright">© 2026 Guia Med. Todos os direitos reservados.</span>
</footer>

<script src="auth.js"></script>
<script>
  /* ---------- Alternância entre abas Entrar / Criar conta ---------- */
  const tabLogin = document.getElementById('tabLogin');
  const tabCadastro = document.getElementById('tabCadastro');
  const formLogin = document.getElementById('formLogin');
  const formCadastro = document.getElementById('formCadastro');
  const btnSwitch = document.getElementById('btnSwitch');
  const textoSwitch = document.getElementById('textoSwitch');

  function mostrarLogin(){
    tabLogin.classList.add('active'); tabCadastro.classList.remove('active');
    formLogin.classList.add('active'); formCadastro.classList.remove('active');
    textoSwitch.textContent = 'Ainda não tem conta?';
    btnSwitch.textContent = 'Criar agora';
  }
  function mostrarCadastro(){
    tabCadastro.classList.add('active'); tabLogin.classList.remove('active');
    formCadastro.classList.add('active'); formLogin.classList.remove('active');
    textoSwitch.textContent = 'Já tem conta?';
    btnSwitch.textContent = 'Entrar';
  }
  tabLogin.addEventListener('click', mostrarLogin);
  tabCadastro.addEventListener('click', mostrarCadastro);
  btnSwitch.addEventListener('click', () => {
    formLogin.classList.contains('active') ? mostrarCadastro() : mostrarLogin();
  });

  /* Se veio de um link "criar conta agora", abre direto na aba de cadastro */
  if(new URLSearchParams(window.location.search).get('cadastro') === '1'){
    mostrarCadastro();
  }

  /* ---------- Utilitário de erro de campo ---------- */
  function setErro(inputId, erroId, mensagem){
    const input = document.getElementById(inputId);
    const erro = document.getElementById(erroId);
    input.closest('.form-group').classList.toggle('invalid', !!mensagem);
    erro.textContent = mensagem || '';
    erro.classList.toggle('show', !!mensagem);
  }

  /* ---------- Envio do login ---------- */
  formLogin.addEventListener('submit', async (e) => {
    e.preventDefault();
    setErro('loginEmail', 'erroLoginEmail', '');
    setErro('loginSenha', 'erroLoginSenha', '');

    const email = document.getElementById('loginEmail').value;
    const senha = document.getElementById('loginSenha').value;

    const resultado = await autenticarUsuario({ email, senha });
    if(!resultado.ok){
      setErro('loginSenha', 'erroLoginSenha', resultado.erro);
      mostrarToast(resultado.erro, 'erro');
      return;
    }
    mostrarToast('Login realizado com sucesso!', 'sucesso');
    const redirect = new URLSearchParams(window.location.search).get('redirect');
    setTimeout(() => window.location.href = redirect || 'index.html', 500);
  });

  /* ---------- Envio do cadastro ---------- */
  formCadastro.addEventListener('submit', async (e) => {
    e.preventDefault();
    ['erroCadNome','erroCadEmail','erroCadSenha','erroCadSenha2'].forEach(id => {
      document.getElementById(id).classList.remove('show');
    });

    const nome = document.getElementById('cadNome').value;
    const email = document.getElementById('cadEmail').value;
    const senha = document.getElementById('cadSenha').value;
    const senha2 = document.getElementById('cadSenha2').value;

    if(senha !== senha2){
      setErro('cadSenha2', 'erroCadSenha2', 'As senhas não coincidem.');
      return;
    }

    const resultado = await cadastrarUsuario({ nome, email, senha });
    if(!resultado.ok){
      mostrarToast(resultado.erro, 'erro');
      if(resultado.erro.includes('e-mail')) setErro('cadEmail', 'erroCadEmail', resultado.erro);
      if(resultado.erro.includes('senha')) setErro('cadSenha', 'erroCadSenha', resultado.erro);
      if(resultado.erro.includes('nome')) setErro('cadNome', 'erroCadNome', resultado.erro);
      return;
    }
    mostrarToast('Conta criada com sucesso! Bem-vindo(a).', 'sucesso');
    setTimeout(() => window.location.href = 'perfil.html', 600);
  });
</script>
<script src="script.js"></script>
</body>
</html>
