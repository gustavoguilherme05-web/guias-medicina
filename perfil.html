<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu perfil — Guia Med</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">Guia<span>Med</span></a>
    <button class="menu-toggle icon-btn" id="menuToggle" aria-label="Abrir menu">☰</button>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Início</a></li>
      <li><a href="index.html#feed">Guias</a></li>
      <li><a href="sobre.html">Sobre</a></li>
      <li><a href="contato.html">Contato</a></li>
    </ul>
    <div class="search-box" style="visibility:hidden;"><input></div>
    <button class="icon-btn" id="darkToggle" title="Alternar modo escuro" aria-label="Alternar modo escuro">🌙</button>
    <div class="auth-area" id="authArea"></div>
  </div>
</header>

<div id="perfilRaiz">
  <!-- preenchido via JS somente se houver sessão ativa -->
</div>

<footer class="site-footer">
  <nav>
    <a href="sobre.html">Sobre</a>
    <a href="privacidade.html">Política de Privacidade</a>
    <a href="contato.html">Contato</a>
  </nav>
  <span class="copyright">© 2026 Guia Med. Todos os direitos reservados.</span>
</footer>

<button class="back-to-top" id="backToTop" aria-label="Voltar ao topo">↑</button>

<script src="auth.js"></script>
<script src="script.js"></script>
<script>
  (async function iniciarPerfil(){
    const sessao = exigirLogin(); // redireciona para login.html se não estiver logado
    if(!sessao) return;

    const raiz = document.getElementById('perfilRaiz');

    let artigos = [];
    try{
      const resp = await fetch('dados.json');
      artigos = await resp.json();
    }catch(e){ console.error(e); }

    const vistos = JSON.parse(localStorage.getItem('guiamed_vistos_' + sessao.email) || '[]');
    const favoritos = getFavoritos(sessao.email);

    const artigosVistos = artigos.filter(a => vistos.includes(a.id));
    const artigosFavoritos = artigos.filter(a => favoritos.includes(a.id));

    function itemLista(a){
      return `
        <li class="perfil-item">
          <span>${a.titulo}</span>
          <span class="meta">
            <a href="artigo.html?id=${a.id}">Ler novamente →</a>
          </span>
        </li>`;
    }

    raiz.innerHTML = `
      <div class="perfil-header">
        <div class="perfil-avatar">${iniciais(sessao.nome)}</div>
        <div>
          <h1>${sessao.nome}</h1>
          <p>${sessao.email}</p>
        </div>
      </div>

      <div class="perfil-stats">
        <div class="stat-card">
          <div class="num">${artigosVistos.length}</div>
          <div class="label">GUIAS LIDOS</div>
        </div>
        <div class="stat-card">
          <div class="num">${artigosFavoritos.length}</div>
          <div class="label">FAVORITOS</div>
        </div>
        <div class="stat-card">
          <div class="num">${artigos.length}</div>
          <div class="label">DISPONÍVEIS</div>
        </div>
      </div>

      <div class="perfil-section">
        <h2>Seus favoritos</h2>
        ${artigosFavoritos.length
          ? `<ul class="perfil-lista">${artigosFavoritos.map(itemLista).join('')}</ul>`
          : `<div class="perfil-vazio">Você ainda não favoritou nenhum guia. Clique no ♥ nos cards da home para salvar aqui.</div>`}

        <h2>Histórico de leitura</h2>
        ${artigosVistos.length
          ? `<ul class="perfil-lista">${artigosVistos.map(itemLista).join('')}</ul>`
          : `<div class="perfil-vazio">Nenhum guia lido ainda. Assim que você abrir um guia, ele aparece aqui.</div>`}
      </div>
    `;
  })();
</script>
</body>
</html>
