  <!-- preenchido via JS somente se houver sessão ativa -->

    <a href="sobre.html">Sobre</a>
    <a href="privacidade.html">Política de Privacidade</a>

  </nav>

<button class="back-to-top" id="backToTop" aria-label="Voltar ao topo">↑</button>

<script src="auth.js"></script>
<script src="script.js"></script>
<script>
  (async function iniciarPerfil(){
    const sessao = exigirLogin(); // redireciona para login.html se não estiver logado
    if(!sessao) return;

    const raiz = document.getElementById('perfilRaiz');

    let artigos = [];
    try{
      const resp = await fetch('dados.json');
      artigos = await resp.json();
    }catch(e){ console.error(e); }

    const vistos = JSON.parse(localStorage.getItem('guiamed_vistos_' + sessao.email) || '[]');
    const favoritos = getFavoritos(sessao.email);

    const artigosVistos = artigos.filter(a => vistos.includes(a.id));
    const artigosFavoritos = artigos.filter(a => favoritos.includes(a.id));

    function itemLista(a){
      return `
        <li class="perfil-item">
          <span>${a.titulo}</span>
          <span class="meta">
            <a href="artigo.html?id=${a.id}">Ler novamente →</a>
          </span>
        </li>`;
    }

    raiz.innerHTML = `
      <div class="perfil-header">
        <div class="perfil-avatar">${iniciais(sessao.nome)}</div>
        <div>
          <h1>${sessao.nome}</h1>
          <p>${sessao.email}</p>
        </div>
      </div>

      <div class="perfil-stats">
        <div class="stat-card">
          <div class="num">${artigosVistos.length}</div>
          <div class="label">GUIAS LIDOS</div>
        </div>
        <div class="stat-card">
          <div class="num">${artigosFavoritos.length}</div>
          <div class="label">FAVORITOS</div>
        </div>
        <div class="stat-card">
          <div class="num">${artigos.length}</div>
          <div class="label">DISPONÍVEIS</div>
        </div>
      </div>

      <section class="perfil-section perfil-assinatura" aria-labelledby="perfilAssinaturaTitulo">
        <h2 id="perfilAssinaturaTitulo">Sua assinatura</h2>
        <p id="perfilAssinaturaStatus" role="status">Consultando seu plano...</p>
        <a id="perfilAssinaturaLink" class="btn btn-primary" href="assinatura.html">Ver assinatura e opções de plano</a>
      </section>

      <div class="perfil-section">
        <h2>Seus favoritos</h2>
        ${artigosFavoritos.length
          ? `<ul class="perfil-lista">${artigosFavoritos.map(itemLista).join('')}</ul>`
          : `<div class="perfil-vazio">Você ainda não favoritou nenhum guia. Clique no ♥ nos cards da home para salvar aqui.</div>`}

        <h2>Histórico de leitura</h2>
        ${artigosVistos.length
          ? `<ul class="perfil-lista">${artigosVistos.map(itemLista).join('')}</ul>`
          : `<div class="perfil-vazio">Nenhum guia lido ainda. Assim que você abrir um guia, ele aparece aqui.</div>`}
      </div>
    `;

    const subscriptionStatus = document.getElementById('perfilAssinaturaStatus');
    try{
      const response = await fetch('/api/billing/status', { credentials: 'same-origin' });
      const data = await response.json();
      if(!response.ok) throw new Error(data?.error || 'Não foi possível consultar seu plano.');

      const planNames = {
        free: 'Gratuito',
        experience: 'PAD EXPERIÊNCIA',
        prescription_only: 'PAD LITE',
        pro: 'PAD PRO'
      };
      const planName = planNames[data.currentPlan] || planNames.free;
      const statusNames = {
        active: 'Ativo',
        trialing: 'Em avaliação',
        past_due: 'Pagamento pendente',
        incomplete: 'Pagamento pendente',
        unpaid: 'Pagamento pendente',
        canceled: 'Cancelado',
        free: 'Sem assinatura ativa'
      };
      const details = data.experienceExpiresAt
        ? `Acesso até ${new Date(data.experienceExpiresAt).toLocaleString('pt-BR')}.`
        : (statusNames[data.status] || 'Consulte os detalhes da assinatura.');
      subscriptionStatus.textContent = `Plano atual: ${planName}. ${details}`;
    }catch(error){
      subscriptionStatus.textContent = error.message || 'Não foi possível consultar seu plano.';
    }
  })();
</script>
</body>
